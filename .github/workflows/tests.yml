name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, dom, pdo_sqlite, zip, gd
          coverage: none
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer test
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-dev --no-interaction --prefer-dist
      - run: php tests/core-only.php
  minimum:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {laravel: '^12.0', testbench: '^10.0'}
          - {laravel: '^13.0', testbench: '^11.0'}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, pdo_sqlite, zip, gd
          coverage: none
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
      - run: composer test
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom, pdo_sqlite, zip, gd
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer format:check
      - run: composer analyse
      - run: composer audit --locked --no-dev
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: Verify exported source builds the same stylesheet
        run: |
          distribution="$(mktemp -d)"
          git archive HEAD | tar -x -C "$distribution"
          npm ci --prefix "$distribution"
          npm run build:css --prefix "$distribution"
          cmp dist/fields.css "$distribution/dist/fields.css"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom, pdo_sqlite, zip, gd
          coverage: none
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: npm run build:css
      - run: php tests/Browser/build-fixture.php
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
